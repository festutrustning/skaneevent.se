[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


# B2B offert must land on FEST /offert/event (partner form + attribution).
# Netlify appends the original query string to the destination.
[[redirects]]
  from = "/offert"
  to = "https://festutrustning.se/offert/event?utm_source=skaneevent&utm_medium=referral&utm_campaign=offert_redirect&cta_context=offert_path_redirect"
  status = 301
  force = true

[[redirects]]
  from = "/offert/"
  to = "https://festutrustning.se/offert/event?utm_source=skaneevent&utm_medium=referral&utm_campaign=offert_redirect&cta_context=offert_path_redirect"
  status = 301
  force = true

[[redirects]]
  from = "/offert/*"
  to = "https://festutrustning.se/offert/event?utm_source=skaneevent&utm_medium=referral&utm_campaign=offert_redirect&cta_context=offert_path_redirect"
  status = 301
  force = true
