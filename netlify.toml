[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


[[redirects]]
  from = "/offert"
  to = "https://festutrustning.se/offert"
  status = 301
  force = true

[[redirects]]
  from = "/offert/"
  to = "https://festutrustning.se/offert"
  status = 301
  force = true

[[redirects]]
  from = "/offert/*"
  to = "https://festutrustning.se/offert"
  status = 301
  force = true
